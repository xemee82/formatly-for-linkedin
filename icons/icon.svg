
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cyanToIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="whiteSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00F2FE" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgDark2)"/>
  <rect x="21" y="21" width="470" height="470" rx="111" fill="none" stroke="url(#neonLine)" stroke-width="3"/>

  <!-- 辅助发光底托 -->
  <ellipse cx="256" cy="410" rx="160" ry="18" fill="#00F2FE" opacity="0.12" filter="blur(10px)"/>

  <!-- 大写粗体 A 与斜体 a 构成的纯正文字排版徽章 -->
  <g filter="url(#shadowDark)">
    <!-- 大写粗体 A -->
    <text x="76" y="378" 
          font-family="'New York', 'Didot', 'Georgia', serif" 
          font-size="310" 
          font-weight="900" 
          fill="url(#whiteSilver)">A</text>

    <!-- 动感斜体小写 a (穿插重叠，霓虹色) -->
    <text x="256" y="378" 
          font-family="'New York', 'Baskerville', 'Georgia', serif" 
          font-size="270" 
          font-weight="700" 
          font-style="italic" 
          fill="url(#cyanToIndigo)">a</text>
  </g>

  <!-- 底部排版格式化基准线 (Luminous Baseline) -->
  <path d="M 96 410 L 416 410" stroke="url(#neonLine)" stroke-width="8" stroke-linecap="round" filter="url(#shadowDark)"/>

  <!-- 顶部星芒 -->
  <path d="M 406 106 Q 406 130, 430 130 Q 406 130, 406 154 Q 406 130, 382 130 Q 406 130, 406 106 Z" fill="#00F2FE"/>
</svg>
