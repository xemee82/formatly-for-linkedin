
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14"/>
      <stop offset="60%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <linearGradient id="goldFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF5E00"/>
    </linearGradient>

    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.75"/>
    </linearGradient>

    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <radialGradient id="centerBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 外框与底色 -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgObsidian)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#centerBurst)"/>
  <rect x="21" y="21" width="470" height="470" rx="111" fill="none" stroke="url(#borderGlow)" stroke-width="3"/>

  <!-- 背景暗纹与动感光束 -->
  <line x1="60" y1="360" x2="452" y2="360" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="60" y1="372" x2="320" y2="372" stroke="#7000FF" stroke-opacity="0.25" stroke-width="3"/>

  <!-- 核心主体：立体切裂重组的字母 F (Format / Formatter) -->
  <g filter="url(#glowF)">
    <!-- 垂直主干 (重磅硬朗纯白衬线粗体) -->
    <path d="M 136 100 L 216 100 L 216 412 L 136 412 Z" fill="url(#silverMetal)"/>
    <!-- 顶部主干衬线 -->
    <polygon points="120,100 232,100 220,112 132,112" fill="#FFFFFF"/>
    <!-- 底部主干衬线 -->
    <polygon points="116,412 236,412 224,400 128,400" fill="url(#silverMetal)"/>

    <!-- 顶部横翼：激光切角极光青渐变 (斜角动感) -->
    <path d="M 216 100 L 396 100 C 408 100, 416 110, 412 122 L 394 172 C 390 182, 380 188, 370 188 L 216 188 Z" fill="url(#neonCyan)"/>

    <!-- 中部横翼：高亮流光斩裂 (动态斜体切刀) -->
    <path d="M 216 236 L 336 236 C 348 236, 356 246, 352 258 L 338 296 C 334 306, 324 312, 314 312 L 216 312 Z" fill="url(#neonCyan)"/>

    <!-- 45度斜向切割一道穿透的耀眼激光刃 (代表斜体 / 变换 / 一键格式化) -->
    <polygon points="340,68 368,68 188,436 160,436" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="346,68 376,68 196,436 166,436" fill="url(#neonCyan)" opacity="0.6"/>
  </g>

  <!-- 格式化能量星芒 (✦ Sparkle) -->
  <path d="M 404 220 Q 404 246, 430 246 Q 404 246, 404 272 Q 404 246, 378 246 Q 404 246, 404 220 Z" fill="#00F0FF" filter="url(#glowF)"/>
  <circle cx="438" cy="214" r="4" fill="#FFFFFF"/>
</svg>
